# Cuenti Time MCP RRHH — Streamable HTTP
# Dominio: https://mcp-time.cuenti.co → PM2 cuenti-time-mcp :4101
#
# DNS: mcp-time.cuenti.co → IP del servidor
# Web (build): NEXT_PUBLIC_MCP_URL=https://mcp-time.cuenti.co/mcp
# MCP proceso:
#   MCP_PUBLIC_URL=https://mcp-time.cuenti.co
#   MCP_ALLOWED_HOSTS=mcp-time.cuenti.co,localhost
#   MCP_HTTP_PORT=4101
#
# Instalación:
#   sudo cp deploy/nginx/cuenti-time-mcp.conf /etc/nginx/sites-available/cuenti-time-mcp
#   sudo ln -sf /etc/nginx/sites-available/cuenti-time-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp-time.cuenti.co

upstream cuenti_time_mcp {
    server 127.0.0.1:4101;
    keepalive 32;
}

map $http_upgrade $connection_upgrade_time_mcp {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp-time.cuenti.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /health {
        proxy_pass http://cuenti_time_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth discovery / DCR / authorize / token (mismo origen MCP)
    location /.well-known/ {
        proxy_pass http://cuenti_time_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://cuenti_time_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://cuenti_time_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_time_mcp;
        # Streamable HTTP / SSE: no bufferizar (nginx ni CF → origin)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }
}
