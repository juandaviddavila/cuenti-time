# Cuenti Time marketing — Nginx reverse proxy
# Dominio: https://time.cuenti.co → Next.js marketing (PM2 cuenti-time-marketing :3008)
#
# Vars de build (marketing):
#   NEXT_PUBLIC_SITE_URL=https://time.cuenti.co
#   NEXT_PUBLIC_APP_URL=https://app-time.cuenti.co
#
# Instalación en Ubuntu:
#   sudo cp deploy/nginx/cuenti-time-site.conf /etc/nginx/sites-available/cuenti-time-site
#   sudo ln -sf /etc/nginx/sites-available/cuenti-time-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d time.cuenti.co

upstream cuenti_time_marketing {
    server 127.0.0.1:3008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name time.cuenti.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirige a HTTPS cuando ya tengas el certificado (certbot suele añadir esto solo)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://cuenti_time_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

