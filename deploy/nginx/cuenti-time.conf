# Cuenti Time SaaS — Nginx reverse proxy
# Dominio: https://app-time.cuenti.co → Next.js app (PM2 cuenti-time :7578)
#
# Vars de build / runtime (raíz):
#   NEXT_PUBLIC_APP_URL=https://app-time.cuenti.co
#   NEXT_PUBLIC_MCP_URL=https://mcp-time.cuenti.co/mcp
#   MCP_UPSTREAM_URL=http://127.0.0.1:4101   (si usas proxy /mcp en Next)
#
# Instalación en Ubuntu:
#   sudo cp deploy/nginx/cuenti-time.conf /etc/nginx/sites-available/cuenti-time
#   sudo ln -sf /etc/nginx/sites-available/cuenti-time /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app-time.cuenti.co

upstream cuenti_time_web {
    server 127.0.0.1:7578;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app-time.cuenti.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirige a HTTPS cuando ya tengas el certificado (certbot suele añadir esto solo)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://cuenti_time_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Rostros / uploads / reportes
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

